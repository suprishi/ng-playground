<mat-accordion>
  <mat-expansion-panel
    *ngFor="let menuItemSection of menu"
    (opened)="navigateTo(menuItemSection)"
  >
    <mat-expansion-panel-header>
      <mat-panel-title> {{ menuItemSection.name }} </mat-panel-title>
    </mat-expansion-panel-header>
    <mat-nav-list>
      <a
      *ngFor="let menuItem of menuItemSection.children"
      mat-list-item
      [routerLink]="menuItem.route"
      >{{ menuItem.name }}</a
      >
    </mat-nav-list>
  </mat-expansion-panel>
</mat-accordion>
